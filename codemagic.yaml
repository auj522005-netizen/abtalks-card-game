workflows:
  android-release:
    name: Android Release Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: 3.24.5
      java: 17
      xcode: 16.0
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Regenerate platform files
        script: flutter create . --platforms android,ios --project-name abtalks_card_game
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 45
    environment:
      flutter: 3.24.5
      xcode: 16.0
      cocoapods: 1.15.2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
